# config/obs_trainReady_hfcs.yaml
# Train-ready packs for the HF-CS cohort (see obs_cleaning_hfcs.yaml).
# Run from data_preprocessing/:
#   python run_obs_trainReady.py --config config/obs_trainReady_hfcs.yaml
paths:
  input_cleaned: "../outputs/hfcs/obs_cleaned.csv"
  output_train_ready: "../train_ready_hfcs"

random_seed: 42
n_seeds: 5                      # five repeated patient-grouped stratified splits

# The cohort is small, so a larger validation split is used for early
# stopping and threshold selection, and only the patient-level protocol runs.
split_sizes: {train: 0.6, val: 0.2, test: 0.2}
protocols: [patient_level]

# Column layout expected by the DualTower-FT training repository:
#   [patient_id, mortality, age (numeric), gender, ethnicity, site_id, ...]
leading_num_cols: [age]
cat_cols: [gender, ethnicity, site_id]

# Never features. hospitaldischargeyear is the temporal-protocol time axis.
extra_exclude_cols: [hospitaldischargeyear]
# Exported to baseline_{train,val,test}.csv beside each pack, never in X.
baseline_cols: [apache_iv_pred]

# Preprocessing
target_col: "mortality"
impute_strategy: "median"
scale_method: "standard"
